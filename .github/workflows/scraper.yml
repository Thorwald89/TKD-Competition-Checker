name: Run Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Permette a GitHub Actions di fare il commit del file aggiornato

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4
          fi

      - name: Run Scraper Script
        run: |
          python scraper.py

      - name: Commit and Push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gare_trovate.json
          git status
          git commit -m "Automated update of scraped competition data" || echo "Nessuna modifica da committare"
          git push

      - name: Upload output artifact
        uses: actions/upload-artifact@v4.6.1
        if: always()
        with:
          name: scraper-results
          path: |
            *.json
            *.csv
            *.txt
            output/
          if-no-files-found: ignore
