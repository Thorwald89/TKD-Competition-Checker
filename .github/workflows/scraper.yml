name: Run Scraper

on:
  schedule:
    # Esegue lo scraper ogni giorno alle 06:00 UTC (modifica se necessario)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permette di avviare il flusso manualmente da GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Sostituisci con la tua versione di Python se diversa
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper Script
        run: |
          python main.py # Sostituisci con il nome del tuo file script Python principale

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-results
          path: output/ # Sostituisci con la cartella o file generato dal tuo scraper
