name: Run Scraper

on:
  schedule:
    # Esegue lo scraper ogni giorno alle 06:00 UTC (07:00 / 08:00 italiane)
    - cron: '0 6 * * *'
  workflow_dispatch: # Ti permette anche di lanciarlo manualmente quando vuoi

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permette a GitHub di salvare e fare il commit dei nuovi dati

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4
          fi

      - name: Run Scraper Script
        run: |
          python scraper.py

      - name: Commit and Push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gare_trovate.json
          git commit -m "Automated update of scraped competition data" || echo "Nessuna nuova gara trovata"
          git push
